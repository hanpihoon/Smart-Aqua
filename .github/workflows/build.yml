name: Build Smart Aquarium CYD

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PlatformIO
        run: pip install platformio==6.1.18

      - name: Build firmware
        run: pio run -e esp32dev

      - name: Prepare flash files
        run: |
          mkdir -p release
          cp .pio/build/esp32dev/firmware.bin release/firmware.bin
          cp .pio/build/esp32dev/bootloader.bin release/bootloader.bin
          cp .pio/build/esp32dev/partitions.bin release/partitions.bin
          cp ~/.platformio/packages/framework-arduinoespressif32/tools/partitions/boot_app0.bin release/boot_app0.bin

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: Smart-Aquarium-CYD-Firmware
          path: release/*
          if-no-files-found: error
